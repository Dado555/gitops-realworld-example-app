# registers charts/realworld-frontend w/ argo cd for prod - values inlined via
# valuesObject, duplicates envs/prod/frontend-values.yaml (see step 7.2 report on
# why: argo reads this file, not envs/prod/*, so ci's promotion pr must update both)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: realworld-frontend-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Dado555/gitops-realworld-example-app.git
    targetRevision: main
    path: charts/realworld-frontend
    helm:
      valuesObject:
        image:
          repository: "262786914511.dkr.ecr.us-east-1.amazonaws.com/realworld-frontend"
          tag: "ec5e2ca"
          digest: "sha256:3977d0f2e90da800757073bd236ea0410ec8490aaad54ccf6b153c7f9ab7e56f"
        replicaCount: 1
        ingress:
          groupOrder: "40"
          listenPort: 8080
  destination:
    server: https://kubernetes.default.svc
    namespace: app-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # step 7.6: hpa owns replicas once live, don't let selfHeal fight it back to the helm-declared value
  #
  # step 9.3: also ignore the hpa's own minReplicas - see the matching comment on
  # realworld-frontend-dev.yaml for why (root-app's own selfHeal reverts a live edit to this
  # Application's spec before this app's selfHeal:false would ever take effect).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/minReplicas
