# registers charts/realworld-frontend w/ argo cd - values inlined via valuesObject, duplicates envs/dev/frontend-values.yaml (see step 7.2 report)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: realworld-frontend-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Dado555/gitops-realworld-example-app.git
    targetRevision: main
    path: charts/realworld-frontend
    helm:
      valuesObject:
        image:
          repository: "262786914511.dkr.ecr.us-east-1.amazonaws.com/realworld-frontend"
          tag: "ec5e2ca"
          digest: "sha256:3977d0f2e90da800757073bd236ea0410ec8490aaad54ccf6b153c7f9ab7e56f"
        replicaCount: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # step 7.6: hpa owns replicas once live, don't let selfHeal fight it back to the helm-declared value
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
