# registers charts/realworld-backend w/ argo cd - values inlined via valuesObject, duplicates envs/dev/backend-values.yaml (see step 7.2 report)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: realworld-backend-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Dado555/gitops-realworld-example-app.git
    targetRevision: main
    path: charts/realworld-backend
    helm:
      valuesObject:
        image:
          repository: "262786914511.dkr.ecr.us-east-1.amazonaws.com/realworld-backend"
          tag: "f865c00"
          digest: "sha256:f61aea7732a72f2688504f7ac83a7f71d6e7bb6187baaf2b094c6059e40db3e5"
        replicaCount: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # step 7.6: hpa owns replicas once live, don't let selfHeal fight it back to the helm-declared value
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
