# registers charts/realworld-backend w/ argo cd - values inlined via valuesObject, duplicates envs/dev/backend-values.yaml (see step 7.2 report)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: realworld-backend-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Dado555/gitops-realworld-example-app.git
    targetRevision: main
    path: charts/realworld-backend
    helm:
      valuesObject:
        image:
          repository: "262786914511.dkr.ecr.us-east-1.amazonaws.com/realworld-backend"
          tag: "5cf48f8"
          digest: "sha256:deeee2f1092a7c5dff4aa1a4bc7126479823af114280d2ffa6a7609f36b4c8d5"
        replicaCount: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
