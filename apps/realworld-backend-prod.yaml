# registers charts/realworld-backend w/ argo cd for prod - values inlined via
# valuesObject, duplicates envs/prod/backend-values.yaml (see step 7.2 report on
# why: argo reads this file, not envs/prod/*, so ci's promotion pr must update both)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: realworld-backend-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Dado555/gitops-realworld-example-app.git
    targetRevision: main
    path: charts/realworld-backend
    helm:
      valuesObject:
        image:
          repository: "262786914511.dkr.ecr.us-east-1.amazonaws.com/realworld-backend"
          tag: "867feaf"
          digest: "sha256:49d5872e20fc171521bc03c2ee3b3680b6c5774a06cb371d2db811d90feda44a"
        replicaCount: 1
        ingress:
          groupOrder: "30"
          listenPort: 8080
  destination:
    server: https://kubernetes.default.svc
    namespace: app-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # step 7.6: hpa owns replicas once live, don't let selfHeal fight it back to the helm-declared value
  #
  # step 9.3: also ignore the hpa's own minReplicas - see the matching comment on
  # realworld-frontend-dev.yaml for why (root-app's own selfHeal reverts a live edit to this
  # Application's spec before this app's selfHeal:false would ever take effect).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/minReplicas
