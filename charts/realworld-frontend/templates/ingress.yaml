{{/* alb path rule for / (catch-all) - shares one alb with the backend ingress via group.name, evaluated after /api */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "realworld-frontend.fullname" . }}
  labels:
    {{- include "realworld-frontend.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/group.name: realworld-dev
    alb.ingress.kubernetes.io/group.order: {{ .Values.ingress.groupOrder | quote }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=realworld-aws-dev-alb-logs-262786914511,access_logs.s3.prefix=alb
    {{- if .Values.ingress.listenPort }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": {{ .Values.ingress.listenPort }}}]'
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "realworld-frontend.fullname" . }}
                port:
                  number: 8080
