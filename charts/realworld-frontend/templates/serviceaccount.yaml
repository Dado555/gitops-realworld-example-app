{{/*
Minimal skeleton resource for Step 7.1 — just enough for `helm template |
kubeconform` to have a real manifest to render and validate. The actual
Deployment/Service/PodDisruptionBudget (with probes, securityContext,
resource limits) are Step 7.2/7.4 scope, not this one.
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "realworld-frontend.serviceAccountName" . }}
  labels:
    {{- include "realworld-frontend.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
