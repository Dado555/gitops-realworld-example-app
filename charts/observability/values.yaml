# values here are namespaced under the dependency name (kube-prometheus-stack) per
# Helm's standard subchart convention - schema verified against the real 88.6.1
# values.yaml, not assumed from memory.
kube-prometheus-stack:
  alertmanager:
    enabled: true

  # the observability namespace enforces the "restricted" PodSecurity standard (step 5.5) -
  # node-exporter fundamentally cannot run under it (hostNetwork/hostPID/hostPath are how it
  # reads host-level metrics, not a misconfiguration - same reasoning as the .trivyignore
  # entries). moving it to kube-system (unrestricted, and where it conceptually belongs
  # alongside the other host-level daemonsets) avoids relaxing observability's own posture
  # for the other components that genuinely don't need it. a well-established, chart-supported
  # pattern, not a workaround - ServiceMonitor discovery follows namespaceOverride automatically.
  prometheus-node-exporter:
    namespaceOverride: kube-system

  prometheus:
    prometheusSpec:
      retention: 15d
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3-backup
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

  grafana:
    persistence:
      enabled: true
      type: sts
      storageClassName: gp3-backup
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      finalizers:
        - kubernetes.io/pvc-protection
    # eso-synced dev/observability/grafana, keys admin-user/admin-password match this
    # chart's own userKey/passwordKey defaults exactly - never set adminPassword here.
    admin:
      existingSecret: grafana-admin
    # same restricted-PodSecurity conflict as node-exporter, different fix: this init container
    # only exists to chown a mounted volume for older grafana images that ran as root by
    # default - this chart's grafana image already runs as its own non-root uid, so the step
    # is both unnecessary and the one thing in this release actually needing root.
    initChownData:
      enabled: false
