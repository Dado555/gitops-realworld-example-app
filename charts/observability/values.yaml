# values here are namespaced under the dependency name (kube-prometheus-stack) per
# Helm's standard subchart convention - schema verified against the real 88.6.1
# values.yaml, not assumed from memory.
kube-prometheus-stack:
  alertmanager:
    enabled: true
    alertmanagerSpec:
      # eso-synced dev/observability/alertmanager-slack (step 9.6) - mounted at
      # /etc/alertmanager/secrets/alertmanager-slack/slack-webhook-url, referenced below via
      # api_url_file rather than api_url so the raw webhook url is never in this values.yaml.
      secrets:
        - alertmanager-slack
    config:
      global:
        resolve_timeout: 5m
      # unchanged from the chart's own default - sensible as-is, no reason to touch it.
      inhibit_rules:
        - source_matchers:
            - "severity = critical"
          target_matchers:
            - "severity =~ warning|info"
          equal:
            - "namespace"
            - "alertname"
        - source_matchers:
            - "severity = warning"
          target_matchers:
            - "severity = info"
          equal:
            - "namespace"
            - "alertname"
        - source_matchers:
            - "alertname = InfoInhibitor"
          target_matchers:
            - "severity = info"
          equal:
            - "namespace"
        - target_matchers:
            - "alertname = InfoInhibitor"
      # default receiver stays 'null' (the chart's own convention, unchanged) - this is what
      # actually silences kube-prometheus-stack's ~150 other default rules (KubeHpaMaxedOut
      # included) without disabling their evaluation entirely: they still show up in
      # Prometheus's own Alerts UI for context, they just never reach a human. only alerts
      # explicitly labeled notify="slack" (the 5 in templates/alerts.yaml) escape 'null'.
      route:
        group_by: ["alertname", "namespace"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: "null"
        routes:
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
          - receiver: "slack-notifications"
            matchers:
              - notify = "slack"
      receivers:
        - name: "null"
        - name: "slack-notifications"
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack-webhook-url
              send_resolved: true
              title: '{{ .CommonAnnotations.summary }}'
              text: "{{ .CommonAnnotations.description }}\n\nRunbook: {{ .CommonAnnotations.runbook_url }}"
      templates:
        - "/etc/alertmanager/config/*.tmpl"

  # eks manages the control plane - these components are structurally unreachable from inside
  # the cluster, so KubeControllerManagerDown/KubeSchedulerDown can never resolve. confirmed
  # both permanently firing live before this change (not a hypothetical) - exactly the "several
  # fire constantly and train you to ignore alerts" default the plan warns about. disabling
  # generation entirely (not just muting) since there's no scenario where seeing these
  # "pending" is useful context, unlike KubeHpaMaxedOut which stays enabled and just doesn't
  # reach Slack via the routing above.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  defaultRules:
    rules:
      kubeControllerManager: false
      kubeSchedulerAlerting: false

  # the observability namespace enforces the "restricted" PodSecurity standard (step 5.5) -
  # node-exporter fundamentally cannot run under it (hostNetwork/hostPID/hostPath are how it
  # reads host-level metrics, not a misconfiguration - same reasoning as the .trivyignore
  # entries). moving it to kube-system (unrestricted, and where it conceptually belongs
  # alongside the other host-level daemonsets) avoids relaxing observability's own posture
  # for the other components that genuinely don't need it. a well-established, chart-supported
  # pattern, not a workaround - ServiceMonitor discovery follows namespaceOverride automatically.
  prometheus-node-exporter:
    namespaceOverride: kube-system

  prometheus:
    prometheusSpec:
      retention: 15d
      # prometheus-cloudwatch-exporter embeds cloudwatch's own datapoint timestamp in each
      # sample rather than using scrape time - found live that this is ~16 minutes old
      # (RDS's own publishing lag plus the exporter's 5-minute statistics period), and
      # Prometheus's default out-of-order window is 0s, silently dropping every sample from
      # this exporter at ingestion despite the scrape itself succeeding (target stayed "up"
      # the whole time - this cost real debugging effort to trace past that). 30m gives
      # comfortable margin over the observed ~16m, not just enough to cover it exactly.
      tsdb:
        outOfOrderTimeWindow: 30m
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3-backup
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

  grafana:
    persistence:
      enabled: true
      type: sts
      storageClassName: gp3-backup
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      finalizers:
        - kubernetes.io/pvc-protection
    # eso-synced dev/observability/grafana, keys admin-user/admin-password match this
    # chart's own userKey/passwordKey defaults exactly - never set adminPassword here.
    admin:
      existingSecret: grafana-admin
    # same restricted-PodSecurity conflict as node-exporter, different fix: this init container
    # only exists to chown a mounted volume for older grafana images that ran as root by
    # default - this chart's grafana image already runs as its own non-root uid, so the step
    # is both unnecessary and the one thing in this release actually needing root.
    initChownData:
      enabled: false

# step 9.6: bridges rds cloudwatch metrics into prometheus's own alerting engine (alert 4 -
# free storage / connections near limit). same two metrics the database dashboard already
# shows via Grafana's separate CloudWatch datasource (step 9.5) - deliberately not more, this
# exporter's only job here is feeding the one alert, not duplicating the whole dashboard.
prometheus-cloudwatch-exporter:
  # matches modules/eks/cloudwatch_exporter.tf's pod identity association - a fixed, known
  # name rather than the chart's auto-generated one.
  serviceAccount:
    name: cloudwatch-exporter
  serviceMonitor:
    enabled: true
    labels:
      release: observability
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi
  # observability enforces restricted PSA (step 5.5) - unlike node-exporter/grafana's
  # init-chown-data (step 9.3), this workload has no genuine reason to need anything beyond
  # restricted's requirements, so it gets the full compliant set up front rather than
  # discovering a live rejection later. matches the backend chart's own established pattern.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # period_seconds: 300 matches RDS standard monitoring's actual 5-minute granularity (this
  # instance has no enhanced monitoring enabled) - a shorter period would just poll CloudWatch
  # for data that hasn't changed yet.
  config: |-
    region: us-east-1
    period_seconds: 300
    metrics:
    - aws_namespace: AWS/RDS
      aws_metric_name: FreeStorageSpace
      aws_dimensions: [DBInstanceIdentifier]
      aws_statistics: [Average]
    - aws_namespace: AWS/RDS
      aws_metric_name: DatabaseConnections
      aws_dimensions: [DBInstanceIdentifier]
      aws_statistics: [Average]
