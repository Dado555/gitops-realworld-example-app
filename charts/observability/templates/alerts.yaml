{{/* step 9.6: five alerts, no more (the plan's own explicit limit). every one carries
     notify: "slack" (matched by values.yaml's Alertmanager route - everything else stays on
     the default 'null' receiver) and a runbook_url (step 9.7's docs/runbooks/*.md, in this
     same repo). release: observability required for Prometheus's own ruleSelector, same as
     every ServiceMonitor in this chart. */}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: realworld-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: observability
spec:
  groups:
    - name: realworld.rules
      rules:
        # alert 1: backend availability below SLO (99.5%, see step 9.5's dashboard for the
        # same target and its justification) for 5 minutes. guarded against the idle-traffic
        # case (0/0 request ratio) - "no traffic" must never read as "100% failure".
        - alert: BackendAvailabilitySLOBreach
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{application="realworld-backend",status!~"5.."}[5m]))
              /
              sum(rate(http_server_requests_seconds_count{application="realworld-backend"}[5m]))
            ) < 0.995
            and
            sum(rate(http_server_requests_seconds_count{application="realworld-backend"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
            notify: "slack"
          annotations:
            summary: "Backend availability below SLO (99.5%)"
            description: "Non-5xx request ratio for realworld-backend has been below 99.5% for 5+ minutes."
            runbook_url: "https://github.com/Dado555/gitops-realworld-example-app/blob/main/docs/runbooks/backend-down.md"

        # alert 2: p95 latency above 500ms (see step 9.5's dashboard for the same target and
        # its justification - ~20x the measured healthy baseline) for 10 minutes.
        - alert: BackendLatencySLOBreach
          expr: |
            histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application="realworld-backend"}[5m])) by (le)) > 0.5
          for: 10m
          labels:
            severity: warning
            notify: "slack"
          annotations:
            summary: "Backend p95 latency above 500ms"
            description: "p95 request latency for realworld-backend has been above 500ms for 10+ minutes."
            runbook_url: "https://github.com/Dado555/gitops-realworld-example-app/blob/main/docs/runbooks/high-latency.md"

        # alert 3: pod crash-looping. reads the container's own waiting-reason directly
        # (kube-state-metrics) rather than inferring from restart-count velocity - a direct
        # signal, not a heuristic.
        - alert: PodCrashLooping
          expr: |
            kube_pod_container_status_waiting_reason{namespace=~"app-dev|app-prod", reason="CrashLoopBackOff"} == 1
          for: 5m
          labels:
            severity: critical
            notify: "slack"
          annotations:
            summary: "Pod {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.pod }}` }} is crash-looping"
            description: "Container {{ `{{ $labels.container }}` }} in {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.pod }}` }} has been in CrashLoopBackOff for 5+ minutes."
            runbook_url: "https://github.com/Dado555/gitops-realworld-example-app/blob/main/docs/runbooks/backend-down.md"

        # alert 4: rds free storage or connections near limit. metric names/values verified
        # live against the deployed prometheus-cloudwatch-exporter before this rule was
        # finalized - see the step 9.6 memory entry for the exact verification. thresholds are
        # real, not round numbers: 20% of the 20GiB allocated (no storage autoscaling
        # configured - this does not self-heal), ~80% of the ~112 max_connections this
        # db.t4g.micro instance's memory computes to (LEAST(DBInstanceClassMemory/9531392, 5000)).
        - alert: RDSStorageOrConnectionsNearLimit
          expr: |
            aws_rds_free_storage_space_average{dbinstance_identifier="realworld-aws-dev-db"} < 4.295e+9
            or
            aws_rds_database_connections_average{dbinstance_identifier="realworld-aws-dev-db"} > 90
          for: 10m
          labels:
            severity: warning
            notify: "slack"
          annotations:
            summary: "RDS realworld-aws-dev-db storage or connections near limit"
            description: "Free storage below 20% of allocated (no autoscaling configured), or connections above ~80% of max_connections, for 10+ minutes."
            runbook_url: "https://github.com/Dado555/gitops-realworld-example-app/blob/main/docs/runbooks/db-issues.md"

        # alert 5: argo application unhealthy or stuck out of sync. sync_status alone would
        # false-positive on normal, short-lived sync churn (this project hits OutOfSync
        # routinely for a few seconds to minutes during a genuine sync, per step 9.3/9.4's own
        # history) - the 15m `for:` is deliberately longer than any normal sync this project
        # has ever taken, not just a round number.
        - alert: ArgoApplicationUnhealthy
          expr: |
            argocd_app_info{health_status="Degraded"} == 1
            or
            argocd_app_info{sync_status="OutOfSync"} == 1
          for: 15m
          labels:
            severity: warning
            notify: "slack"
          annotations:
            summary: "Argo Application {{ `{{ $labels.name }}` }} unhealthy or not synced"
            description: "{{ `{{ $labels.name }}` }} has been Degraded or OutOfSync for 15+ minutes."
            runbook_url: "https://github.com/Dado555/gitops-realworld-example-app/blob/main/docs/runbooks/incident-response.md"
