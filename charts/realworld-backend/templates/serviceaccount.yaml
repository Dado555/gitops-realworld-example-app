{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "realworld-backend.serviceAccountName" . }}
  labels:
    {{- include "realworld-backend.labels" . | nindent 4 }}
  annotations:
    # a preSync hook itself (no hook-delete-policy, so it persists as a normal
    # resource) at an earlier sync-wave than the migrate job's PreSync hook -
    # otherwise, on a brand-new application, argo tries to run the migrate job
    # (which needs this serviceaccount) before the ordinary Sync phase would
    # ever create it, deadlocking (found live on realworld-backend-prod's
    # first-ever sync, step 8.6 - dev never hit this because its serviceaccount
    # already existed from a much earlier deploy)
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
