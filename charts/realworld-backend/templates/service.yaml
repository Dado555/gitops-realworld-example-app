{{/* ClusterIP for the backend workload - traffic port plus the mgmt port (step 9.4, for
     ServiceMonitor scraping - stays cluster-internal, never routed through the ALB) */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "realworld-backend.fullname" . }}
  labels:
    {{- include "realworld-backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 8081
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "realworld-backend.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
