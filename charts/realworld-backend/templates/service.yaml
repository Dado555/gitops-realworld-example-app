{{/* ClusterIP for the backend workload - traffic port only (8080), not the mgmt port */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "realworld-backend.fullname" . }}
  labels:
    {{- include "realworld-backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "realworld-backend.selectorLabels" . | nindent 4 }}
