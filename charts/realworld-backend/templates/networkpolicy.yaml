{{/* permanent backend egress-allow to RDS - default-deny-egress (Step 5.5) blocks this without it.
     also a preSync hook itself (earlier wave than the migrate job's) - same deadlock as the
     serviceaccount fix: the migrate job can't reach the database via the ordinary Sync phase's
     NetworkPolicy, since Sync doesn't run until PreSync (the migrate job) finishes. found live
     on realworld-backend-prod's first-ever sync, step 8.6. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "realworld-backend.fullname" . }}-egress-rds
  labels:
    {{- include "realworld-backend.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      {{- include "realworld-backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.20.0/24
        - ipBlock:
            cidr: 10.0.21.0/24
      ports:
        - protocol: TCP
          port: 5432
---
{{/* permanent backend ingress-allow from the alb - default-deny-ingress (Step 5.5) blocks this without it; target-type=ip means traffic arrives from the public-subnet cidrs, not a k8s-native source */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "realworld-backend.fullname" . }}-ingress-alb
  labels:
    {{- include "realworld-backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "realworld-backend.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/24
        - ipBlock:
            cidr: 10.0.1.0/24
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
---
{{/* step 7.7: allow prometheus (phase 9, not deployed yet) to scrape the mgmt port - matches zero pods today, harmless */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "realworld-backend.fullname" . }}-ingress-prometheus
  labels:
    {{- include "realworld-backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "realworld-backend.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8081
